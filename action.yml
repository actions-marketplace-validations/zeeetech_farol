name: farol
description: >-
  Static accessibility audit for HEEx templates. Runs mix farol, uploads
  findings to GitHub code scanning as SARIF, and fails the workflow on
  error-severity findings.
author: zeetech
branding:
  icon: check-circle
  color: purple

inputs:
  paths:
    description: Paths or globs to audit (space-separated)
    default: "lib/**/*.heex"
  sarif-file:
    description: Where to write the SARIF report
    default: farol.sarif

runs:
  using: composite
  steps:
    # Elixir/OTP must already be set up (erlef/setup-beam) and deps fetched.
    - name: Audit templates
      id: audit
      shell: bash
      run: |
        set +e
        mix farol ${{ inputs.paths }} --format sarif --output "${{ inputs.sarif-file }}"
        echo "exit=$?" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Upload SARIF to code scanning
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}

    - name: Fail on error-severity findings
      shell: bash
      run: exit "${{ steps.audit.outputs.exit }}"
